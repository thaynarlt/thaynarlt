name: Atualizar cards do perfil

on:
  schedule:
    - cron: '0 9 * * *' # todo dia às 06:00 (horário de João Pessoa)
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths:
      - perfil.config.mjs
      - assets/**
      - scripts/**

permissions:
  contents: write

concurrency:
  group: atualizar-perfil
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run gerar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar cards atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualizar cards do perfil"
            git push
          fi
